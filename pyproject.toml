[project]
name = "flightplan"
version = "0.2.0"
description = "Code based description for Concourse pipelines"
authors = [{ name = "Maic Siemering", email = "maic@siemering.tech" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["concourse", "yaml", "ci/cd"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "black>=25.1",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/eruvanos/flightplan"
Repository = "https://github.com/eruvanos/flightplan"
Documentation = "https://github.com/eruvanos/flightplan"

[project.scripts]
fp = "flightplan.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
